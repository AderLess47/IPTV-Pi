# IPTV-Pi: continuous integration and image building.
#
#   verify       every push / pull request, Python 3
#   verify-py27  every push / pull request, real Python 2.7 (Kodi 18 in the
#                image ships 2.7, so the web UI has to keep working there)
#   build-images manual run or a v* tag, one job per board: Buildroot image,
#                RAUC bundle and its checksum as downloadable artifacts
name: IPTV-Pi

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Python 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flask
        run: pip install "flask>=2.3" "werkzeug>=2.3"
      - name: Compile the Python sources
        run: |
          python -m py_compile webui/app.py tests/verify_ab_update.py tests/verify_rauc_ui.py
      - name: Check the inline JavaScript
        run: |
          python - <<'PY'
          import re
          page = open("webui/templates/index.html").read()
          open("/tmp/dashboard.js", "w").write(
              re.findall(r"<script>(.*?)</script>", page, re.S)[-1])
          PY
          node --check /tmp/dashboard.js
      - name: A/B update and data partition suite
        run: python tests/verify_ab_update.py
      - name: System update card suite
        run: python tests/verify_rauc_ui.py

  verify-py27:
    # The image runs Kodi 18, which brings Python 2.7; the web UI must work
    # there too, so the real test suites run on a real 2.7 interpreter.
    name: verify (Python 2.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run both suites under Python 2.7
        # One script for CI and for a developer laptop: it uses python:2.7-slim
        # through Docker and the same pins as this job, so `./tests/run-py27.sh`
        # reproduces exactly what happens here.
        run: sh tests/run-py27.sh

  rauc-key:
    # Every image trusts exactly the certificate it was built with, so all
    # builds have to sign with the same key: a key generated per build would
    # make a bundle from a newer release impossible to install on an already
    # flashed box. The runner is disposable, so the pair lives in the Actions
    # cache and only there: the build jobs restore the same cache entry
    # themselves, so the private key never travels as a downloadable artifact.
    name: RAUC signing key
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Restore the shared signing key
        uses: actions/cache@v4
        with:
          path: rauc-keys
          key: iptvpi-rauc-key-v1

      - name: Create the key when there is none yet
        run: |
          set -e
          install -d -m 0700 rauc-keys
          if [ ! -f rauc-keys/ca.cert.pem ] || [ ! -f rauc-keys/ca.key.pem ]; then
            # Losing the cached key means every box flashed with an earlier
            # release stops accepting new bundles; the warning is deliberate.
            echo "::warning::no cached RAUC key - generating a new development key; bundles from earlier releases will not install any more"
            openssl req -x509 -newkey rsa:4096 -nodes -days 3650 \
              -subj "/CN=IPTV-Pi development signing key" \
              -keyout rauc-keys/ca.key.pem -out rauc-keys/ca.cert.pem
            chmod 0600 rauc-keys/ca.key.pem
          fi
          openssl x509 -in rauc-keys/ca.cert.pem -noout -fingerprint -sha256

      # No artifact: the cache saved by this job is the only way the pair
      # reaches the build jobs. Check the write worked before they start.
      - name: Make sure the pair is in the cache
        run: |
          set -e
          test -s rauc-keys/ca.cert.pem
          test -s rauc-keys/ca.key.pem
          echo "the pair is cached as iptvpi-rauc-key-v1 once this job finishes"

  build-images:
    name: build image (${{ matrix.board }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: rauc-key
    env:
      # post-build.sh signs with exactly this pair, so both boards of this run
      # and every later release share one certificate.
      IPTVPI_RAUC_CERT: ${{ github.workspace }}/rauc-keys/ca.cert.pem
      IPTVPI_RAUC_KEY: ${{ github.workspace }}/rauc-keys/ca.key.pem
    # Buildroot 2021.02 ships Python 2.7.18 for its host tools, and that Python
    # cannot build its ssl module against OpenSSL 3 - on the 22.04 runner the
    # resulting setuptools build aborts with SIGABRT. The job therefore runs in
    # debian:bullseye, which has the OpenSSL 1.1.1 and GCC 10 of that era.
    runs-on: ubuntu-22.04
    container:
      image: debian:bullseye
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        board: [pi1, pi2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore the shared signing key
        # Read-only: only the rauc-key job may write this cache entry, so a
        # build can never replace the shared pair with one of its own.
        id: rauc-key
        uses: actions/cache/restore@v4
        with:
          path: rauc-keys
          key: iptvpi-rauc-key-v1

      - name: Check the shared signing key is usable
        # Building with a missing or mismatched pair would produce a bundle
        # that no flashed box accepts, and only on a box would that show.
        run: |
          set -e
          if [ "${{ steps.rauc-key.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::the shared RAUC key was not restored from the Actions cache"
          fi
          if [ ! -s rauc-keys/ca.cert.pem ] || [ ! -s rauc-keys/ca.key.pem ]; then
            echo "::error::rauc-keys/ is empty - the shared RAUC signing key did not survive the cache. Re-run the 'RAUC signing key' job (workflow_dispatch) so it recreates and caches the pair, then start the build again. Building this job would sign a bundle that every already flashed box rejects."
            exit 1
          fi
          cert_pub="$(openssl x509 -in rauc-keys/ca.cert.pem -noout -pubkey)"
          key_pub="$(openssl pkey -in rauc-keys/ca.key.pem -pubout)"
          if [ "$cert_pub" != "$key_pub" ]; then
            echo "::error::rauc-keys/ca.cert.pem and rauc-keys/ca.key.pem do not belong together"
            exit 1
          fi
          openssl x509 -in rauc-keys/ca.cert.pem -noout -fingerprint -sha256

      - name: Point apt at the Debian archive
        # bullseye is past its LTS window, so deb.debian.org no longer serves
        # its security updates; the archive still does.
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update

      - name: Install host build dependencies
        # The job runs inside the container, so there is no sudo and no runner
        # toolchain to remove: the image is the build host.
        run: |
          # kodi's configure step runs ./autogen.sh (and its bundled cpluff
          # does too) once the patches touch the build files, so the autotools
          # have to be on the host. autopoint is its own package since Ubuntu
          # 12.04 and gettext only suggests it - with --no-install-recommends
          # it is NOT pulled in, which is exactly what failed twice.
          apt-get install -y --no-install-recommends \
            build-essential bison flex libncurses-dev libssl-dev \
            gettext autopoint autoconf automake libtool pkg-config gperf gdb \
            bc bzip2 cpio file git patch perl rsync sed tar unzip wget \
            ca-certificates e2fsprogs dosfstools mtools python3 \
            default-jre-headless

      - name: Check the host tools the autotools need
        run: |
          # Fail in seconds instead of 40 minutes into the kodi build.
          for tool in autopoint aclocal autoconf automake libtoolize \
                      pkg-config gperf msgfmt; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "missing host tool: $tool" >&2
              exit 1
            fi
          done
          echo "all autotools present"

      - name: Cache the Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('br2-external/configs/*', 'br2-external/external.mk', 'br2-external/Config.in') }}
          restore-keys: |
            buildroot-dl-

      - name: Smoke-test Buildroot's host python
        # Buildroot's own host python is the first thing that runs on the
        # builder; building just that pair takes minutes, the full image takes
        # hours, so a broken host toolchain is reported long before Kodi.
        run: ./build_os.sh ${{ matrix.board }} --host-tools-only

      - name: Build the ${{ matrix.board }} image
        run: ./build_os.sh ${{ matrix.board }}
      - name: Check the image trusts the shared signing key
        # A silent key change would only show up when a box refuses an update.
        run: |
          set -e
          built="output/${{ matrix.board }}/images/rauc/ca.cert.pem"
          cmp rauc-keys/ca.cert.pem "$built"
          openssl x509 -in "$built" -noout -fingerprint -sha256

      - name: Collect sdcard.img, bundle and checksum
        run: |
          set -e
          mkdir -p artifacts
          images="output/${{ matrix.board }}/images"
          cp "$images/sdcard.img" artifacts/sdcard-${{ matrix.board }}.img
          cp "$images"/iptvpi-*.raucb artifacts/
          cp "$images"/iptvpi-*.raucb.sha256 artifacts/
          ls -l artifacts
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload the image and the update bundle
        uses: actions/upload-artifact@v4
        with:
          name: iptvpi-${{ matrix.board }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
