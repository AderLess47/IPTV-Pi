# IPTV-Pi: slot UUIDs used by the RAUC boot script and system.conf.
#
# PARTUUID values on an MBR disk are "<disk-signature>-<partition number>".
# post-image.sh pins the disk signature (IPTVPI_DISK_PARTUUID, default
# 49505456) so these never change between builds; if you override it there,
# update this file and /etc/rauc/system.conf as well.
#
#   p1 boot.vfat   firmware, kernel, cmdline.txt
#   p2 rootfs A    the rootfs built by Buildroot
#   p3 rootfs B    written by the first RAUC update
#   p4 data        /var/lib/iptv (playlists, state, logs, app, Kodi profile)
ROOTFS_A="49505456-02"
ROOTFS_B="49505456-03"
DATA_PARTUUID="49505456-04"
