# IPTV-Pi :: kernel VM tunables for a 256 MB / 1 GB IPTV appliance
#
# Applied at boot by systemd-sysctl (enabled in post-build.sh). Every value
# here trades "disk" for "RAM", because the SD card is both the slowest part
# of the box and the part that dies from too many writes.

# Swapping goes to zram (compressed RAM), never to the SD card: swap early
# and often so the page cache keeps room.
vm.swappiness = 100

# Shrink the dentry/inode caches faster; Kodi and the web UI touch few files.
vm.vfs_cache_pressure = 200

# Keep dirty pages few and short-lived so a power cut loses at most a couple
# of seconds of writes instead of tens of megabytes.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# A small reserved pool: enough for atomic allocations under memory pressure,
# small enough not to waste the 256 MB budget.
vm.min_free_kbytes = 4096

# Do not let a single process over-commit the box into the OOM killer.
vm.overcommit_memory = 0
