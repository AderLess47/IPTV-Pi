# IPTV-Pi: systemd supervisor settings.
#
# RuntimeWatchdogSec is only read from this file (it cannot be set in a
# drop-in), so the overlay ships the whole file. systemd opens /dev/watchdog
# (bcm2835_wdt, built into the kernel by kernel-iptv.fragment), pets it twice
# per interval and stops petting it when the manager or PID 1 is wedged — the
# SoC then resets the board instead of hanging on a frozen Kodi.
#
# 15 s is long enough that a slow SD write or a busy H.264 decode cannot starve
# the pet, and short enough that a dead box is back before anyone walks over.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=10min
