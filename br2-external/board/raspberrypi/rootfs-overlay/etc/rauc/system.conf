[system]
compatible=iptvpi
# The Raspberry Pi firmware has no A/B logic: it always boots the kernel from
# the FAT partition and follows cmdline.txt, so the "bootloader" is that file
# plus the small state files in /boot/rauc. iptv-boot-slot implements the
# interface RAUC expects.
bootloader=custom

[handlers]
bootloader-custom-backend=iptv-boot-slot

# Slot devices are addressed by PARTUUID (pinned in post-image.sh), not by
# /dev/mmcblk0pN, so the mapping survives a different enumeration.
[slot.rootfs.0]
device=/dev/disk/by-partuuid/49505456-02
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/49505456-03
type=ext4
bootname=B
