# IPTV-Pi Wi-Fi configuration (wlan0)
#
# Edit the ssid/psk below, then either reboot or run:
#     systemctl restart wpa_supplicant-wlan0
#
# The web interface does not touch this file: Wi-Fi is intentionally
# configured over SSH/serial so a bad playlist upload can never lock you
# out of the box. The control interface is not built in (Buildroot 2021.02
# builds wpa_supplicant without it), so changes need a service restart:
#     systemctl restart wpa_supplicant-wlan0

# Two-letter country code, required for 5 GHz channels and TX power.
country=00

network={
	ssid="CHANGE_ME"
	psk="CHANGE_ME_TOO"
	key_mgmt=WPA-PSK
}
